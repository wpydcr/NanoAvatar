<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NanoAvatar 简单版</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<header><h1>NanoAvatar 简单版</h1><p>上传一个人物视频，再用文字或音频让人物开口。</p></header>
<div class="layout">
<section class="preview"><canvas id="avatar" width="540" height="960" aria-label="人物预览"></canvas>
<div id="placeholder">请先上传人物视频</div><div id="stage">等待视频</div></section>
<section class="controls">
<form id="video-form"><h2>1. 上传人物视频</h2>
<input id="video-file" type="file" accept="video/*,.mp4,.mov,.m4v,.webm,.avi" required>
<p id="video-hint">单人、正面、连续镜头；最多 256 MB。</p>
<button id="upload-video" type="submit">上传并准备</button>
<progress id="progress" value="0" max="1"></progress><p id="video-status" role="status">无需制作人物包。</p></form>
<div><h2>2. 让人物说话</h2>
<label for="prompt">输入文字</label><textarea id="prompt" rows="4" maxlength="1000" placeholder="输入想让人物回应的话…"></textarea>
<div class="actions"><button id="send" disabled>发送</button><button id="stop" class="secondary" disabled>停止</button>
<button id="audio" class="secondary" disabled>上传音频</button><input id="audio-file" type="file" accept="audio/*" hidden></div>
<p class="hint">上传音频无需 API Key。文字对话请先填写下方云端设置。</p>
<div id="answer" aria-live="polite"></div></div>
<details><summary>文字对话设置</summary><div class="settings">
<label>DashScope API Key<input id="api-key" type="password" autocomplete="off" placeholder="只保存在本次服务进程内"></label>
<label>语言模型<input id="llm-model" value="qwen-plus"></label>
<label>语音模型<input id="tts-model" value="cosyvoice-v2"></label>
<label>音色<input id="voice" value="longxiaochun_v2"></label>
<button id="save-settings" class="secondary" disabled>应用设置</button><span id="key-status"></span></div></details>
<p id="notice" role="alert"></p><div class="footer"><span id="connection">未连接</span><button id="reconnect" class="secondary" hidden>重新连接</button><span id="latency"></span></div>
</section></div>
</main><script type="module" src="/static/app.js"></script></body></html>
