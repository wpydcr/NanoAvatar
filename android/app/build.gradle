plugins { id 'com.android.application' }

def fullAssets = providers.gradleProperty('fullBundleAssets').orNull
def liteAssets = providers.gradleProperty('liteBundleAssets').orNull
def targetHtpArch = providers.gradleProperty('targetHtpArch').orElse('75').get()
if (!(targetHtpArch in ['69', '75', '69,75'])) throw new GradleException('targetHtpArch must be 69, 75 or 69,75')
def payloadDirectory = { String path ->
    if (targetHtpArch == '75') return '"payload"'
    def name = 'payload-htp' + targetHtpArch.replace(',', '-')
    if (path != null) {
        def config = new File(rootProject.file(path), 'bundled/payload/phone_config.json')
        if (config.isFile()) name += '-' + java.security.MessageDigest.getInstance('SHA-256')
                .digest(config.bytes).encodeHex().toString().substring(0, 16)
    }
    '"' + name + '"'
}
def requireAssets = { String flavor, String path ->
    if (path == null) throw new GradleException('Missing -P' + flavor + 'BundleAssets')
    def root = rootProject.file(path)
    if (!new File(root, 'bundled/payload/phone_config.json').isFile()
            || !new File(root, 'bundled/avatar/avatar.json').isFile()) {
        throw new GradleException(flavor + 'BundleAssets must contain bundled payload and avatar manifests')
    }
    def config = new groovy.json.JsonSlurper().parse(new File(root, 'bundled/payload/phone_config.json'))
    def modelArches = config.target_htp_arch instanceof List ? config.target_htp_arch.join(',') : config.target_htp_arch.toString()
    if (modelArches != targetHtpArch)
        throw new GradleException(flavor + ' model architecture does not match targetHtpArch=' + targetHtpArch)
    root
}
android {
    namespace 'com.avatar.nputest'
    compileSdk 35
    defaultConfig {
        minSdk 31
        targetSdk 34
        versionCode 8
        versionName '1.0.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    flavorDimensions 'edition'
    productFlavors {
        full {
            dimension 'edition'
            applicationId 'com.nanoavatar.demo'
            resValue 'string', 'app_name', 'NanoAvatar'
            buildConfigField 'int', 'MOUTH_STRIDE', '1'
            buildConfigField 'String', 'MODEL_PAYLOAD_DIR', payloadDirectory(fullAssets)
            manifestPlaceholders = [launcherIcon: '@mipmap/ic_launcher',
                                    launcherRoundIcon: '@mipmap/ic_launcher_round']
        }
        lite {
            dimension 'edition'
            applicationId 'com.nanoavatar.lite200'
            resValue 'string', 'app_name', 'NanoAvatar Lite'
            buildConfigField 'int', 'MOUTH_STRIDE', '2'
            buildConfigField 'String', 'MODEL_PAYLOAD_DIR', payloadDirectory(liteAssets)
            manifestPlaceholders = [launcherIcon: '@mipmap/ic_launcher_lite',
                                    launcherRoundIcon: '@mipmap/ic_launcher_lite_round']
        }
    }
    sourceSets {
        if (fullAssets != null) full.assets.srcDir(rootProject.file(fullAssets))
        if (liteAssets != null) lite.assets.srcDir(rootProject.file(liteAssets))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { signingConfig signingConfigs.debug }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/libQnnHtpPrepare.so', '**/libQnnGpu.so', '**/libQnnDsp.so',
                         '**/libQnnDspV66Skel.so', '**/libQnnDspV66Stub.so']
        }
    }
    buildFeatures { buildConfig = true }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def keptArches = targetHtpArch != '75' ? targetHtpArch.tokenize(',') :
                (variant.productFlavors.any { it.second == 'lite' } ? ['75'] : null)
        if (keptArches != null) variant.packaging.jniLibs.excludes.addAll(
                ['68', '69', '73', '75', '79', '81'].findAll { !(it in keptArches) }
                        .collect { '**/libQnnHtpV' + it + '*.so' })
    }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { output ->
            def name = variant.flavorName == 'full' ? 'NanoAvatar' : 'NanoAvatar-Lite'
            output.outputFileName = name + (targetHtpArch == '75' ? '' : '-HTP' + targetHtpArch.replace(',', '-')) + '.apk'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path == ':app:mergeFullReleaseAssets' })
        requireAssets('full', fullAssets)
    if (graph.allTasks.any { it.path == ':app:mergeLiteReleaseAssets' })
        requireAssets('lite', liteAssets)
}

dependencies {
    implementation files('libs/xz-1.12.jar')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0'
    implementation 'com.qualcomm.qti:onnxruntime-android-qnn:2.5.0'
    implementation 'com.qualcomm.qti:qnn-runtime:2.49.0'
}
